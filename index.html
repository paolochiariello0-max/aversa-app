<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Aversa - Guida Ufficiale, Mappa 3D & AI Smart Guide</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- SDK Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #e0e0e0; }

    /* Banner Notifica Aggiornamento App */
    .update-banner { display: none; background: #ff9800; color: #000; padding: 10px 16px; font-weight: bold; font-size: 0.85rem; justify-content: space-between; align-items: center; z-index: 3000; }
    .update-banner button { background: #000; color: #fff; border: none; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

    /* Header con Foto Reale dell'Orologio dell'Annunziata */
    header { background: #1f1f1f; color: #ffffff; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 1000; border-bottom: 1px solid #333; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #4fc3f7; display: flex; align-items: center; gap: 8px; }
    .clock-img-logo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #4fc3f7; }
    .user-profile { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }

    /* Barra di Ricerca Live */
    .search-box { background: #1f1f1f; padding: 10px 16px; border-bottom: 1px solid #333; z-index: 1000; display: flex; gap: 8px; }
    .search-box input { flex: 1; padding: 8px 14px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 20px; font-size: 0.85rem; outline: none; }
    .search-box button { background: #0288d1; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    /* Nav Tabs */
    .nav-tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; z-index: 1000; }
    .tab-btn { flex: 1; padding: 12px 6px; border: none; background: none; font-weight: 600; color: #9e9e9e; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .tab-btn.active { color: #4fc3f7; border-bottom: 3px solid #4fc3f7; }

    /* Panels */
    .content-area { flex: 1; position: relative; overflow: hidden; }
    .view-panel { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; overflow-y: auto; }
    .view-panel.active { display: block; }

    /* Filter & Poi Grid */
    .filter-bar { display: flex; gap: 6px; padding: 12px 16px; background: #181818; border-bottom: 1px solid #2a2a2a; overflow-x: auto; }
    .chip { padding: 6px 14px; background: #2a2a2a; color: #ccc; border-radius: 16px; font-size: 0.8rem; border: 1px solid #3d3d3d; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .chip.active { background: #0288d1; color: white; border-color: #0288d1; }

    .status-info { padding: 8px 16px; font-size: 0.8rem; color: #81d4fa; background: #0d47a1; text-align: center; font-weight: 500; }

    .poi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
    .poi-card { background: #242424; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.4); border: 1px solid #333; cursor: pointer; padding: 14px; }
    .poi-card h3 { font-size: 0.95rem; margin-bottom: 6px; color: #fff; }
    .poi-card p { font-size: 0.82rem; color: #aaa; line-height: 1.3; }
    .poi-badge { display: inline-block; margin-top: 8px; font-size: 0.75rem; background: #003c8f; color: #80d8ff; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

    /* Mappa Vista 2D/3D */
    #map-wrapper { width: 100%; height: 100%; position: relative; overflow: hidden; background: #0f172a; }
    #map-view { width: 100%; height: 100%; transition: transform 0.4s ease; }
    #map-view.view-3d { transform: rotateX(30deg) scale(1.05); transform-origin: center bottom; }

    .map-toggle-btn { position: absolute; top: 12px; right: 12px; z-index: 1500; background: #1f1f1f; color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    /* Modal Dettaglio & Reclami */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: flex-end; }
    .modal-content { background: #222; color: #fff; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; animation: slideUp 0.25s ease-out; border-top: 1px solid #444; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.5rem; background: none; border: none; cursor: pointer; color: #aaa; }

    /* Chatbot AI Widget Avanzato */
    .ai-fab { position: fixed; bottom: 20px; right: 20px; background: #0288d1; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; z-index: 1800; border: 2px solid #fff; }
    .chat-window { display: none; position: fixed; bottom: 85px; right: 20px; width: 340px; height: 460px; background: #1f1f1f; border: 1px solid #333; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 1800; flex-direction: column; overflow: hidden; }
    .chat-header { background: #0288d1; color: white; padding: 10px 14px; font-weight: bold; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .chat-body { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 10px; background: #181818; }
    .msg { padding: 10px 12px; border-radius: 12px; max-width: 88%; line-height: 1.35; }
    .msg-bot { background: #2b2b2b; color: #e0e0e0; align-self: flex-start; border: 1px solid #3c3c3c; }
    .msg-user { background: #0288d1; color: white; align-self: flex-end; }
    .chat-footer { display: flex; padding: 8px; border-top: 1px solid #333; background: #1f1f1f; }
    .chat-footer input { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 16px; font-size: 0.8rem; outline: none; }
    .chat-footer button { background: #0288d1; color: white; border: none; padding: 8px 14px; border-radius: 16px; margin-left: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

    /* Form Reclami */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; background: #2b2b2b; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }
    .btn-submit { background: #e53935; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>

      Visit Aversa
