<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aversa Visit & Smart City</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f9; color: #333; }
    
    header { background: #003580; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 1000; }
    header h1 { font-size: 1.1rem; font-weight: 600; }

    .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; z-index: 1000; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: 600; color: #666; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #003580; border-bottom: 3px solid #003580; }

    .content-area { flex: 1; position: relative; overflow: hidden; }
    #map-view, #list-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #list-view { display: none; overflow-y: auto; padding: 16px; background: #f4f6f9; }

    /* Filtri */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .chip { padding: 6px 14px; background: #e0e0e0; border-radius: 20px; font-size: 0.85rem; border: none; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #003580; color: white; }

    /* Griglia Monumenti */
    .poi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .poi-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s; }
    .poi-card:active { transform: scale(0.98); }
    .poi-card img { width: 100%; height: 160px; object-fit: cover; }
    .poi-card-body { padding: 12px; }
    .poi-card-body h3 { font-size: 1rem; color: #111; margin-bottom: 4px; }
    .poi-card-body p { font-size: 0.85rem; color: #666; line-height: 1.3; }
    .poi-tag { display: inline-block; margin-top: 8px; font-size: 0.75rem; background: #eef3fc; color: #003580; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

    /* Modal / Scheda Dettaglio */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: flex-end; }
    .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.5rem; background: none; border: none; cursor: pointer; color: #555; }
    .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>Aversa Visit 3D</h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('map')">🗺️ Mappa</button>
    <button class="tab-btn" onclick="switchTab('list')">🏛️ Monumenti</button>
  </div>

  <div class="content-area">
    <!-- Vista Mappa -->
    <div id="map-view"></div>

    <!-- Vista Lista -->
    <div id="list-view">
      <div class="filter-bar">
        <button class="chip active" onclick="filterCategory('all', this)">Tutti</button>
        <button class="chip" onclick="filterCategory('Chiese', this)">Chiese</button>
        <button class="chip" onclick="filterCategory('Monumenti', this)">Monumenti</button>
        <button class="chip" onclick="filterCategory('Cultura', this)">Cultura</button>
      </div>
      <div class="poi-grid" id="poi-container"></div>
    </div>
  </div>

  <!-- Modal Dettaglio Monumento -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modal-img" class="modal-img" src="" alt="Foto monumento">
      <span class="poi-tag" id="modal-tag">Categoria</span>
      <h2 id="modal-title" style="margin: 8px 0;">Titolo</h2>
      <p id="modal-desc" style="color: #444; line-height: 1.5; font-size: 0.95rem;"></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Database dei Monumenti di Aversa
    const poiData = [
      {
        id: 1,
        title: "Duomo di Aversa (Cattedrale di San Paolo)",
        category: "Chiese",
        coords: [40.9754, 14.2039],
        img: "https://images.unsplash.com/photo-1548625361-18159187313a?auto=format&fit=crop&w=600&q=80",
        desc: "Splendida cattedrale romanica risalente al XI secolo, famosa per la sua cupola arabo-normanna e le opere d'arte custodite all'interno."
      },
      {
        id: 2,
        title: "Castello Aragonese",
        category: "Monumenti",
        coords: [40.9731, 14.2062],
        img: "https://images.unsplash.com/photo-1599946347371-68eb71b16afc?auto=format&fit=crop&w=600&q=80",
        desc: "Imponente fortezza eretta nel XV secolo, simbolo del potere politico e militare della città durante la dominazione aragonese."
      },
      {
        id: 3,
        title: "Chiesa di San Francesco delle Monache",
        category: "Chiese",
        coords: [40.9745, 14.2050],
        img: "https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=600&q=80",
        desc: "Complesso monumentale di grande valore artistico e storico nel cuore del centro antico di Aversa."
      },
      {
        id: 4,
        title: "Teatro Cimarosa",
        category: "Cultura",
        coords: [40.9720, 14.2075],
        img: "https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=600&q=80",
        desc: "Storico teatro intitolato al celebre compositore aversano Domenico Cimarosa, centro della vita culturale cittadina."
      }
    ];

    // Inizializzazione Mappa
    const map = L.map('map-view').setView([40.974, 14.205], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Render Iniziale
    let currentCategory = 'all';

    function renderMapMarkers() {
      poiData.forEach(poi => {
        const marker = L.marker(poi.coords).addTo(map);
        marker.bindPopup(`
          <div style="text-align:center;">
            <b>${poi.title}</b><br>
            <button onclick="openModal(${poi.id})" style="margin-top:6px; background:#003580; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Visualizza Scheda</button>
          </div>
        `);
      });
    }

    function renderList() {
      const container = document.getElementById('poi-container');
      container.innerHTML = '';
      const filtered = currentCategory === 'all' ? poiData : poiData.filter(p => p.category === currentCategory);

      filtered.forEach(poi => {
        const card = document.createElement('div');
        card.className = 'poi-card';
        card.onclick = () => openModal(poi.id);
        card.innerHTML = `
          <img src="${poi.img}" alt="${poi.title}" loading="lazy">
          <div class="poi-card-body">
            <h3>${poi.title}</h3>
            <p>${poi.desc.substring(0, 75)}...</p>
            <span class="poi-tag">${poi.category}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(tab === 'map') {
        document.getElementById('map-view').style.display = 'block';
        document.getElementById('list-view').style.display = 'none';
        event.target.classList.add('active');
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        document.getElementById('map-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'block';
        event.target.classList.add('active');
      }
    }

    function openModal(id) {
      const poi = poiData.find(p => p.id === id);
      if(!poi) return;
      document.getElementById('modal-img').src = poi.img;
      document.getElementById('modal-title').innerText = poi.title;
      document.getElementById('modal-desc').innerText = poi.desc;
      document.getElementById('modal-tag').innerText = poi.category;
      document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    // Registrazione Service Worker per PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
    }

    // Init
    renderMapMarkers();
    renderList();
  </script>
</body>
</html>
