<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Aversa - Guida Completa & Mappa Live</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f8f9fa; color: #212529; }

    /* Header */
    header { background: #1a73e8; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 1000; }
    header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .header-btns { display: flex; gap: 8px; }
    .btn-ta { background: #00af87; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

    /* Barra di Ricerca Live */
    .search-box { background: #ffffff; padding: 10px 16px; border-bottom: 1px solid #e0e0e0; z-index: 1000; display: flex; gap: 8px; }
    .search-box input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 0.85rem; outline: none; }
    .search-box button { background: #1a73e8; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    /* Nav Tabs */
    .nav-tabs { display: flex; background: #ffffff; border-bottom: 1px solid #e0e0e0; z-index: 1000; }
    .tab-btn { flex: 1; padding: 12px 6px; border: none; background: none; font-weight: 600; color: #5f6368; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .tab-btn.active { color: #1a73e8; border-bottom: 3px solid #1a73e8; }

    /* Panels */
    .content-area { flex: 1; position: relative; overflow: hidden; }
    .view-panel { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; overflow-y: auto; }
    .view-panel.active { display: block; }

    /* Filter & Poi Grid */
    .filter-bar { display: flex; gap: 6px; padding: 12px 16px; background: white; border-bottom: 1px solid #eee; overflow-x: auto; }
    .chip { padding: 6px 12px; background: #f1f3f4; border-radius: 16px; font-size: 0.8rem; border: none; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .chip.active { background: #1a73e8; color: white; }

    .status-info { padding: 10px 16px; font-size: 0.8rem; color: #5f6368; background: #e8f0fe; text-align: center; font-weight: 500; }

    .poi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
    .poi-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid #eee; cursor: pointer; padding: 12px; }
    .poi-card h3 { font-size: 0.95rem; margin-bottom: 4px; color: #202124; }
    .poi-card p { font-size: 0.82rem; color: #5f6368; line-height: 1.3; }
    .poi-badge { display: inline-block; margin-top: 8px; font-size: 0.75rem; background: #e8f0fe; color: #1a73e8; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: flex-end; }
    .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.5rem; background: none; border: none; cursor: pointer; color: #555; }
    .btn-ta-link { display: inline-block; width: 100%; text-align: center; background: #00af87; color: white; padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 14px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>📍 Visit Aversa Direct</h1>
    <div class="header-btns">
      <a href="https://www.tripadvisor.it/Tourism-g804150-Aversa_Province_of_Caserta_Campania-Vacations.html" target="_blank" class="btn-ta">🦉 TripAdvisor Aversa</a>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Cerca scuole, pizzerie, chiese, vie, negozi ad Aversa...">
    <button onclick="searchLive()">Cerca</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchView('attractions-view', this)">🏛️ Tutti i Luoghi</button>
    <button class="tab-btn" onclick="switchView('map-view', this)">🗺️ Mappa Live</button>
  </div>

  <div class="content-area">
    <!-- Vista Luoghi -->
    <div id="attractions-view" class="view-panel active">
      <div class="filter-bar">
        <button class="chip active" onclick="loadCategory('all', this)">Tutti</button>
        <button class="chip" onclick="loadCategory('church', this)">⛪ Chiese & Culto</button>
        <button class="chip" onclick="loadCategory('school', this)">🏫 Scuole & Università</button>
        <button class="chip" onclick="loadCategory('food', this)">🍕 Pizzerie & Bar</button>
        <button class="chip" onclick="loadCategory('historic', this)">🏛️ Monumenti & Storici</button>
        <button class="chip" onclick="loadCategory('shop', this)">🛍️ Negozi & Shopping</button>
      </div>
      <div class="status-info" id="status-text">Caricamento automatico di tutti i luoghi dal database aperto di Aversa...</div>
      <div class="poi-grid" id="attractions-container"></div>
    </div>

    <!-- Vista Mappa -->
    <div id="map-view" class="view-panel"></div>
  </div>

  <!-- Modal Dettaglio -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <span id="modal-badge" class="poi-badge" style="margin-bottom:6px;"></span>
      <h2 id="modal-title" style="margin: 6px 0 10px 0;"></h2>
      <p id="modal-desc" style="color: #444; line-height: 1.4; font-size: 0.9rem; margin-bottom: 12px;"></p>
      <a id="modal-ta-link" class="btn-ta-link" href="#" target="_blank">🦉 Apri scheda specifica su TripAdvisor</a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let poiData = [];

    let map = L.map('map-view').setView([40.974, 14.205], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    let markersGroup = L.layerGroup().addTo(map);

    // Bounding Box di Aversa per la ricerca dati
    const aversaBbox = "40.955,14.185,40.990,14.225";

    async function fetchOverpassData(typeKey) {
      document.getElementById('status-text').innerText = "Interrogazione database in corso per Aversa...";
      let queryType = '';

      if (typeKey === 'church') queryType = 'node["amenity"="place_of_worship"](' + aversaBbox + ');';
      else if (typeKey === 'school') queryType = 'node["amenity"~"school|kindergarten|university|college"](' + aversaBbox + ');';
      else if (typeKey === 'food') queryType = 'node["amenity"~"restaurant|pizzeria|fast_food|cafe|pub"](' + aversaBbox + ');';
      else if (typeKey === 'historic') queryType = 'node["historic"](' + aversaBbox + ');';
      else if (typeKey === 'shop') queryType = 'node["shop"](' + aversaBbox + ');';
      else {
        queryType = 'node["amenity"](' + aversaBbox + '); node["historic"](' + aversaBbox + '); node["shop"](' + aversaBbox + ');';
      }

      const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];(${queryType});out 150;`;

      try {
        const res = await fetch(overpassUrl);
        const data = await res.json();
        poiData = data.elements.filter(e => e.tags && e.tags.name).map(e => ({
          id: e.id,
          name: e.tags.name,
          category: e.tags.amenity || e.tags.historic || e.tags.shop || "Luogo d'interesse",
          street: e.tags['addr:street'] ? (e.tags['addr:street'] + ' ' + (e.tags['addr:housenumber']||'')) : 'Aversa',
          lat: e.lat,
          lon: e.lon
        }));

        document.getElementById('status-text').innerText = `Trovati ${poiData.length} luoghi registrati ad Aversa.`;
        renderList(poiData);
        renderMap(poiData);
      } catch (err) {
        document.getElementById('status-text').innerText = "Impossibile scaricare i dati live al momento. Riprova tra poco.";
      }
    }

    function renderList(list) {
      const container = document.getElementById('attractions-container');
      container.innerHTML = '';

      if(list.length === 0) {
        container.innerHTML = '<p style="padding:20px; text-align:center;">Nessun risultato trovato.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'poi-card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>📍 ${item.street}</p>
          <span class="poi-badge">${item.category.toUpperCase()}</span>
        `;
        container.appendChild(card);
      });
    }

    function renderMap(list) {
      markersGroup.clearLayers();
      list.forEach(item => {
        const marker = L.marker([item.lat, item.lon]).addTo(markersGroup);
        marker.bindPopup(`<b>${item.name}</b><br>📍 ${item.street}<br><br><button onclick="openModalById(${item.id})">Visualizza Dettaglio</button>`);
      });
    }

    function loadCategory(catKey, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if(btn) btn.classList.add('active');
      fetchOverpassData(catKey);
    }

    async function searchLive() {
      const q = document.getElementById('search-input').value.trim();
      if(!q) return;

      document.getElementById('status-text').innerText = `Ricerca in corso per "${q}"...`;
      const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' Aversa')}&limit=30`;

      try {
        const res = await fetch(searchUrl);
        const data = await res.json();
        poiData = data.map(e => ({
          id: e.place_id,
          name: e.display_name.split(',')[0],
          category: e.type || "Ricerca",
          street: e.display_name,
          lat: parseFloat(e.lat),
          lon: parseFloat(e.lon)
        }));

        document.getElementById('status-text').innerText = `Risultati per "${q}": ${poiData.length} elementi trovati.`;
        renderList(poiData);
        renderMap(poiData);
      } catch (err) {
        document.getElementById('status-text').innerText = "Errore durante la ricerca.";
      }
    }

    function openModal(item) {
      document.getElementById('modal-title').innerText = item.name;
      document.getElementById('modal-desc').innerText = `Indirizzo: ${item.street}\nCoordinate: ${item.lat}, ${item.lon}`;
      document.getElementById('modal-badge').innerText = item.category.toUpperCase();

      // Generazione dinamica dell'URL specifico di TripAdvisor per il luogo selezionato
      const taDirectUrl = `https://www.tripadvisor.it/Search?q=${encodeURIComponent(item.name + ' Aversa')}`;
      const taLinkElement = document.getElementById('modal-ta-link');
      taLinkElement.href = taDirectUrl;
      taLinkElement.innerText = `🦉 Cerca "${item.name}" su TripAdvisor`;

      document.getElementById('detail-modal').style.display = 'flex';
    }

    function openModalById(id) {
      const item = poiData.find(p => p.id === id);
      if(item) openModal(item);
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    function switchView(viewId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if(viewId === 'map-view') {
        setTimeout(() => map.invalidateSize(), 200);
      }
    }

    // Inizializzazione con tutti i luoghi
    fetchOverpassData('all');
  </script>
</body>
</html>
