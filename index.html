<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Aversa - Guida Digitale Live 3D</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #e0e0e0; }

    /* Header */
    header { background: #1f1f1f; color: #ffffff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 1000; border-bottom: 1px solid #333; }
    header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; color: #4fc3f7; }

    /* Barra di Ricerca Live */
    .search-box { background: #1f1f1f; padding: 10px 16px; border-bottom: 1px solid #333; z-index: 1000; display: flex; gap: 8px; }
    .search-box input { flex: 1; padding: 8px 14px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 20px; font-size: 0.85rem; outline: none; }
    .search-box input::placeholder { color: #aaa; }
    .search-box button { background: #0288d1; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    /* Nav Tabs */
    .nav-tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; z-index: 1000; }
    .tab-btn { flex: 1; padding: 12px 6px; border: none; background: none; font-weight: 600; color: #9e9e9e; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .tab-btn.active { color: #4fc3f7; border-bottom: 3px solid #4fc3f7; }

    /* Panels */
    .content-area { flex: 1; position: relative; overflow: hidden; }
    .view-panel { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; overflow-y: auto; }
    .view-panel.active { display: block; }

    /* Filter & Poi Grid */
    .filter-bar { display: flex; gap: 6px; padding: 12px 16px; background: #181818; border-bottom: 1px solid #2a2a2a; overflow-x: auto; }
    .chip { padding: 6px 14px; background: #2a2a2a; color: #ccc; border-radius: 16px; font-size: 0.8rem; border: 1px solid #3d3d3d; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .chip.active { background: #0288d1; color: white; border-color: #0288d1; }

    .status-info { padding: 8px 16px; font-size: 0.8rem; color: #81d4fa; background: #0d47a1; text-align: center; font-weight: 500; }

    .poi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
    .poi-card { background: #242424; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.4); border: 1px solid #333; cursor: pointer; padding: 14px; transition: transform 0.2s; }
    .poi-card:hover { transform: translateY(-2px); }
    .poi-card h3 { font-size: 0.95rem; margin-bottom: 6px; color: #fff; }
    .poi-card p { font-size: 0.82rem; color: #aaa; line-height: 1.3; }
    .poi-badge { display: inline-block; margin-top: 8px; font-size: 0.75rem; background: #003c8f; color: #80d8ff; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

    /* Mappa Vista 3D */
    #map-wrapper { width: 100%; height: 100%; perspective: 1000px; overflow: hidden; background: #0f172a; }
    #map-view { width: 100%; height: 100%; transform: rotateX(25deg) scale(1.08); transform-origin: center bottom; transition: transform 0.3s; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: flex-end; }
    .modal-content { background: #222; color: #fff; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; animation: slideUp 0.25s ease-out; border-top: 1px solid #444; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.5rem; background: none; border: none; cursor: pointer; color: #aaa; }
    
    .btn-action-group { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 0.9rem; border: none; cursor: pointer; }
    .btn-google { background: #4285f4; color: white; }
    .btn-web { background: #2e7d32; color: white; }
  </style>
</head>
<body>

  <header>
    <h1>📍 Visit Aversa 3D</h1>
  </header>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Cerca stazioni, scuole, B&B, monumenti, bar...">
    <button onclick="searchLive()">Cerca</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchView('attractions-view', this)">🏛️ Tutti i Luoghi</button>
    <button class="tab-btn" onclick="switchView('map-wrapper', this)">🗺️ Mappa 3D Live</button>
  </div>

  <div class="content-area">
    <!-- Vista Luoghi -->
    <div id="attractions-view" class="view-panel active">
      <div class="filter-bar">
        <button class="chip active" onclick="loadCategory('all', this)">Tutti</button>
        <button class="chip" onclick="loadCategory('transit', this)">🚄 Mobilità & Metro</button>
        <button class="chip" onclick="loadCategory('hotel', this)">🏨 Hotel & B&B</button>
        <button class="chip" onclick="loadCategory('church', this)">⛪ Chiese & Culto</button>
        <button class="chip" onclick="loadCategory('school', this)">🏫 Scuole & Università</button>
        <button class="chip" onclick="loadCategory('food', this)">🍕 Ristoranti & Bar</button>
        <button class="chip" onclick="loadCategory('historic', this)">🏛️ Monumenti</button>
      </div>
      <div class="status-info" id="status-text">Caricamento automatico di tutti i luoghi dal database aperto di Aversa...</div>
      <div class="poi-grid" id="attractions-container"></div>
    </div>

    <!-- Vista Mappa 3D -->
    <div id="map-wrapper" class="view-panel">
      <div id="map-view"></div>
    </div>
  </div>

  <!-- Modal Dettaglio -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <span id="modal-badge" class="poi-badge" style="margin-bottom:6px;"></span>
      <h2 id="modal-title" style="margin: 6px 0 10px 0; color: #fff;"></h2>
      <p id="modal-desc" style="color: #ccc; line-height: 1.4; font-size: 0.9rem; margin-bottom: 12px;"></p>
      
      <div class="btn-action-group">
        <a id="modal-google-link" class="btn-action btn-google" href="#" target="_blank">🔍 Scheda Google & Maps</a>
        <a id="modal-web-link" class="btn-action btn-web" href="#" target="_blank" style="display:none;">🌐 Sito / Pagina Ufficiale</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let poiData = [];

    // Inizializzazione Mappa
    let map = L.map('map-view').setView([40.974, 14.205], 16);
    
    // Mappa Satellitare/Topografica stile 3D con Esri World Imagery
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    }).addTo(map);

    let markersGroup = L.layerGroup().addTo(map);

    // Bounding Box Aversa
    const aversaBbox = "40.955,14.185,40.990,14.225";

    async function fetchOverpassData(typeKey) {
      document.getElementById('status-text').innerText = "Interrogazione database in corso per Aversa...";
      let queryType = '';

      if (typeKey === 'transit') {
        queryType = 'node["railway"](' + aversaBbox + '); node["station"](' + aversaBbox + '); node["amenity"="bus_station"](' + aversaBbox + ');';
      } else if (typeKey === 'hotel') {
        queryType = 'node["tourism"~"hotel|guest_house|hostel|apartment|motel"](' + aversaBbox + ');';
      } else if (typeKey === 'church') {
        queryType = 'node["amenity"="place_of_worship"](' + aversaBbox + ');';
      } else if (typeKey === 'school') {
        queryType = 'node["amenity"~"school|kindergarten|university|college"](' + aversaBbox + ');';
      } else if (typeKey === 'food') {
        queryType = 'node["amenity"~"restaurant|pizzeria|fast_food|cafe|pub"](' + aversaBbox + ');';
      } else if (typeKey === 'historic') {
        queryType = 'node["historic"](' + aversaBbox + ');';
      } else {
        queryType = 'node["amenity"](' + aversaBbox + '); node["historic"](' + aversaBbox + '); node["tourism"](' + aversaBbox + '); node["railway"](' + aversaBbox + ');';
      }

      const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];(${queryType});out 180;`;

      try {
        const res = await fetch(overpassUrl);
        const data = await res.json();
        poiData = data.elements.filter(e => e.tags && (e.tags.name || e.tags.railway || e.tags.tourism)).map(e => ({
          id: e.id,
          name: e.tags.name || e.tags.railway || "Punto d'Interesse",
          category: e.tags.railway ? "Stazione / Trasporti" : (e.tags.tourism || e.tags.amenity || e.tags.historic || "Luogo"),
          street: e.tags['addr:street'] ? (e.tags['addr:street'] + ' ' + (e.tags['addr:housenumber']||'')) : 'Aversa',
          website: e.tags.website || e.tags['contact:website'] || e.tags['contact:facebook'] || null,
          lat: e.lat,
          lon: e.lon
        }));

        document.getElementById('status-text').innerText = `Trovati ${poiData.length} luoghi ad Aversa.`;
        renderList(poiData);
        renderMap(poiData);
      } catch (err) {
        document.getElementById('status-text').innerText = "Impossibile recuperare i dati al momento. Riprova tra poco.";
      }
    }

    function renderList(list) {
      const container = document.getElementById('attractions-container');
      container.innerHTML = '';

      if(list.length === 0) {
        container.innerHTML = '<p style="padding:20px; text-align:center;">Nessun risultato trovato.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'poi-card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>📍 ${item.street}</p>
          <span class="poi-badge">${item.category.toUpperCase()}</span>
        `;
        container.appendChild(card);
      });
    }

    function renderMap(list) {
      markersGroup.clearLayers();
      list.forEach(item => {
        const marker = L.marker([item.lat, item.lon]).addTo(markersGroup);
        marker.bindPopup(`<b>${item.name}</b><br>📍 ${item.street}<br><br><button onclick="openModalById(${item.id})">Visualizza Scheda</button>`);
      });
    }

    function loadCategory(catKey, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if(btn) btn.classList.add('active');
      fetchOverpassData(catKey);
    }

    async function searchLive() {
      const q = document.getElementById('search-input').value.trim();
      if(!q) return;

      document.getElementById('status-text').innerText = `Ricerca in corso per "${q}"...`;
      const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' Aversa')}&limit=30`;

      try {
        const res = await fetch(searchUrl);
        const data = await res.json();
        poiData = data.map(e => ({
          id: e.place_id,
          name: e.display_name.split(',')[0],
          category: e.type || "Ricerca",
          street: e.display_name,
          website: null,
          lat: parseFloat(e.lat),
          lon: parseFloat(e.lon)
        }));

        document.getElementById('status-text').innerText = `Risultati per "${q}": ${poiData.length} elementi trovati.`;
        renderList(poiData);
        renderMap(poiData);
      } catch (err) {
        document.getElementById('status-text').innerText = "Errore durante la ricerca.";
      }
    }

    function openModal(item) {
      document.getElementById('modal-title').innerText = item.name;
      document.getElementById('modal-desc').innerText = `Indirizzo: ${item.street}\nCoordinate: ${item.lat}, ${item.lon}`;
      document.getElementById('modal-badge').innerText = item.category.toUpperCase();

      // Scheda Google & Maps dinamica
      const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(item.name + ' Aversa')}`;
      document.getElementById('modal-google-link').href = googleSearchUrl;

      // Link Diretto Sito / Social (se presente nel database)
      const webBtn = document.getElementById('modal-web-link');
      if (item.website) {
        webBtn.href = item.website;
        webBtn.style.display = 'flex';
      } else {
        webBtn.style.display = 'none';
      }

      document.getElementById('detail-modal').style.display = 'flex';
    }

    function openModalById(id) {
      const item = poiData.find(p => p.id === id);
      if(item) openModal(item);
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    function switchView(viewId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if(viewId === 'map-wrapper') {
        setTimeout(() => map.invalidateSize(), 250);
      }
    }

    // Caricamento iniziale
    fetchOverpassData('all');
  </script>
</body>
</html>
