<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aversa Smart City 3D</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .hud-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="hud-panel">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <strong style="font-size: 15px;">🤖 Aversa Smart App</strong>
                <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">
                    <span class="status-dot"></span>Sciame Agenti H24 Attivo
                </p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        var map = L.map('map', { zoomControl: false }).setView([40.9729, 14.2078], 15);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        var pois = [
            { name: "Duomo di Aversa", coords: [40.9729, 14.2078], info: "Cattedrale Normanna (Cultura)" },
            { name: "Arco dell'Annunziata", coords: [40.9735, 14.2085], info: "Simbolo storico di Aversa" },
            { name: "Pasticceria Mungiguerra", coords: [40.9718, 14.2065], info: "Casa della Polacca Aversana" },
            { name: "Pizzeria Sammarco", coords: [40.9692, 14.2041], info: "Eccellenza Food Aversana" },
            { name: "Stazione Aversa", coords: [40.9702, 14.2155], info: "Snodo Ferroviario principali tratte" }
        ];

        pois.forEach(function(p) {
            L.marker(p.coords).addTo(map)
                .bindPopup("<b>" + p.name + "</b><br>" + p.info);
        });
    </script>
</body>
</html>
